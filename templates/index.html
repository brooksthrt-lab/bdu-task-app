<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BDU Full-Stack Task Tracker</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; max-width: 500px; margin: 60px auto; padding: 20px; }
    h1 { color: #38bdf8; }
    .row { display: flex; gap: 10px; margin: 20px 0; }
    input { flex: 1; padding: 10px; border-radius: 6px; border: none; }
    button { padding: 10px 18px; background: #38bdf8; color: #0f172a; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
    li { background: #1e293b; padding: 12px; margin-bottom: 8px; border-radius: 6px; list-style: none; }
  </style>
</head>
<body>

  <h1>BDU Study Tasks 📚</h1>
  <div class="row">
    <input type="text" id="taskInput" placeholder="e.g., Finish Database Assignment..." />
    <button onclick="addTask()">Add</button>
  </div>
  <ul id="taskList"></ul>

  <script>
    async function loadTasks() {
      const res = await fetch('/api/tasks');
      const tasks = await res.json();
      const list = document.getElementById('taskList');
      list.innerHTML = tasks.map(t => `
        <li style="display:flex; justify-content:space-between; align-items:center;">
          <span>${t.title}</span>
          <button onclick="deleteTask(${t.id})" style="background:#ef4444; color:white; padding:4px 10px;">Delete</button>
        </li>
      `).join('');
    }

    async function addTask() {
      const input = document.getElementById('taskInput');
      if (!input.value.trim()) return;
      await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: input.value })
      });
      input.value = '';
      loadTasks();
    }

    async function deleteTask(id) {
      await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
      loadTasks();
    }

    loadTasks();
  </script>


</body>
</html>
